<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D FPV Casino - Poker & Blackjack HD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #070a0f; user-select: none; }
        .poker-stage { perspective: 800px; overflow: hidden; }
        .chip-glow { box-shadow: 0 0 15px rgba(245, 158, 11, 0.5); }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-amber-500 selection:text-black">

    <!-- TOP BAR CONTROL -->
    <header class="w-full bg-slate-900/90 backdrop-blur border-b border-amber-500/20 px-3 py-2 sm:px-4 sm:py-3 flex flex-wrap justify-between items-center z-30 gap-2">
        <div class="flex items-center gap-2">
            <span class="text-xl sm:text-2xl">👑</span>
            <div>
                <h1 class="text-xs sm:text-base font-bold tracking-wider text-amber-400 uppercase leading-none">FPV 3D Casino</h1>
                <div id="user-badge" class="text-[10px] text-slate-400 mt-0.5">Pemain: Samuel</div>
            </div>
        </div>

        <div class="flex items-center gap-2 sm:gap-4 flex-wrap">
            <div class="flex bg-slate-800 p-1 rounded-xl border border-slate-700 text-[11px] sm:text-xs">
                <button id="mode-poker" onclick="switchGameMode('POKER')" class="px-3 py-1 sm:px-4 sm:py-1.5 rounded-lg font-bold transition-all bg-amber-500 text-slate-950 shadow-md">POKER</button>
                <button id="mode-bj" onclick="switchGameMode('BLACKJACK')" class="px-3 py-1 sm:px-4 sm:py-1.5 rounded-lg font-bold transition-all text-slate-400 hover:text-white">BLACKJACK</button>
            </div>

            <button onclick="toggleOnlineModal()" class="flex items-center gap-1 text-[11px] sm:text-xs px-3 py-1.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-extrabold rounded-xl shadow border border-blue-400/40 active:scale-95 transition-all">
                🌐 MAIN ONLINE
            </button>
        </div>
    </header>

    <!-- MAIN GAME CANVAS CONTAINER -->
    <main class="flex-1 flex flex-col items-center justify-center p-1 sm:p-4 relative">

        <!-- ONLINE ROOM MODAL -->
        <div id="online-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
            <div class="bg-slate-900 border border-blue-500/40 rounded-3xl p-6 max-w-sm w-full shadow-2xl relative text-center">
                <button onclick="toggleOnlineModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white font-bold text-lg">✕</button>
                <span class="text-4xl">🌐</span>
                <h3 class="text-xl font-black text-blue-400 uppercase tracking-wider mt-2">MULTIPLAYER ONLINE</h3>
                <p class="text-xs text-slate-400 mt-1 mb-5">Main bersama teman & saudara di meja 3D yang sama via Firebase!</p>

                <div class="flex flex-col gap-3">
                    <div class="bg-slate-950 p-3 rounded-2xl border border-slate-800">
                        <label class="text-[11px] font-bold text-slate-400 uppercase block mb-1">1. Buat Room Baru</label>
                        <button onclick="handleCreateRoomUI()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 font-bold text-xs text-white rounded-xl shadow transition-all">
                            ✨ BUAT MEJA ONLINE
                        </button>
                    </div>

                    <div class="text-xs text-slate-500 font-bold uppercase my-1">- ATAU -</div>

                    <div class="bg-slate-950 p-3 rounded-2xl border border-slate-800">
                        <label class="text-[11px] font-bold text-slate-400 uppercase block mb-1">2. Gabung Room Teman</label>
                        <div class="flex gap-1.5 mt-1">
                            <input type="text" id="room-code-input" placeholder="KODE (CTH: ROOM123)" class="flex-1 bg-slate-900 border border-slate-700 text-amber-400 uppercase font-black text-xs rounded-xl px-3 py-2 focus:outline-none focus:border-blue-500 text-center">
                            <button onclick="handleJoinRoomUI()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 font-bold text-xs text-white rounded-xl shadow transition-all shrink-0">
                                GABUNG
                            </button>
                        </div>
                    </div>
                </div>

                <div id="room-status-info" class="mt-4 text-xs font-semibold text-amber-400 hidden"></div>
            </div>
        </div>

        <!-- STAGE 3D CANVAS -->
        <div class="poker-stage w-full max-w-5xl h-[380px] sm:h-[500px] flex items-center justify-center relative rounded-2xl sm:rounded-3xl border border-slate-800 bg-slate-950">
            <canvas id="pokerCanvas" class="w-full h-full cursor-grab active:cursor-grabbing"></canvas>
            <canvas id="confettiCanvas" class="absolute inset-0 pointer-events-none z-40 w-full h-full"></canvas>

            <div id="active-room-indicator" class="absolute top-3 left-3 bg-blue-950/80 border border-blue-500 px-3 py-1 rounded-xl text-xs font-bold text-blue-300 hidden z-20">
                Meja Aktif: <span id="display-room-code">-</span>
            </div>

            <div class="absolute bottom-3 right-3 z-20 flex gap-1">
                <button onclick="panCamera(-100)" class="bg-slate-900/90 text-amber-400 border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold">◀ Kiri</button>
                <button onclick="resetCamera()" class="bg-slate-900/90 text-slate-300 border border-slate-700 px-2.5 py-1.5 rounded-xl text-xs font-bold">🎯 Reset</button>
                <button onclick="panCamera(100)" class="bg-slate-900/90 text-amber-400 border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold">Kanan ▶</button>
            </div>
        </div>

        <!-- GAME LOG & STATUS -->
        <div class="w-full max-w-5xl mt-2 sm:mt-3 flex justify-between items-center px-2 sm:px-4 gap-2">
            <div id="game-log" class="text-[11px] sm:text-xs text-slate-300 bg-slate-900/90 border border-slate-800 rounded-lg px-3 py-1.5 flex-1 truncate">
                Selamat datang di Royal Casino 3D! Meja siap dimainkan.
            </div>
            <div id="pot-display" class="text-amber-400 font-extrabold text-xs sm:text-base bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/35 shrink-0">
                POT: Rp 0
            </div>
        </div>
    </main>

    <!-- ACTION CONTROLS BAR -->
    <footer class="w-full bg-slate-900 border-t border-slate-800 p-2 sm:p-3 z-30">
        <div class="max-w-5xl mx-auto flex flex-col gap-2">
            <div id="poker-controls" class="flex flex-col sm:flex-row items-center gap-2 w-full justify-between">
                <div class="flex items-center gap-1.5 w-full sm:w-auto">
                    <button onclick="handlePlayerAction('FOLD')" class="flex-1 sm:w-28 py-3 bg-red-600 font-extrabold text-xs sm:text-sm rounded-xl">FOLD</button>
                    <button onclick="handlePlayerAction('CHECK')" class="flex-1 sm:w-28 py-3 bg-slate-700 font-extrabold text-xs sm:text-sm rounded-xl">CHECK</button>
                    <button onclick="handlePlayerAction('CALL')" class="flex-1 sm:w-36 py-3 bg-blue-600 font-extrabold text-xs sm:text-sm rounded-xl">CALL</button>
                </div>
            </div>
            <div id="bj-controls" class="hidden flex items-center gap-3 w-full justify-center">
                <button onclick="blackjackHit()" class="px-8 py-3 bg-emerald-600 font-black text-sm rounded-xl">HIT</button>
                <button onclick="blackjackStand()" class="px-8 py-3 bg-amber-600 font-black text-sm rounded-xl">STAND</button>
            </div>
        </div>
    </footer>

    <!-- FIREBASE INTEGRATION & GAME ENGINE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC-QC5ufx_jLmdgehitBAxxQ4CphhK872Q",
            authDomain: "royal-casino-3d.firebaseapp.com",
            projectId: "royal-casino-3d",
            storageBucket: "royal-casino-3d.firebasestorage.app",
            messagingSenderId: "848524822068",
            appId: "1:848524822068:web:7c0b09f7dd42ba44adac61",
            measurementId: "G-5ER4EZNF5Y"
        };

        let db = null;
        let isReady = false;

        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            const auth = getAuth(app);
            signInAnonymously(auth).then(() => {
                isReady = true;
                console.log("Firebase Terhubung & Siap!");
            });
        } catch (e) {
            console.error("Firebase Init Error:", e);
        }

        window.toggleOnlineModal = function() {
            document.getElementById('online-modal').classList.toggle('hidden');
        };

        window.handleCreateRoomUI = async function() {
            if (!isReady || !db) {
                alert("Koneksi Firebase sedang diproses, coba sebentar lagi.");
                return;
            }

            const roomCode = 'ROOM-' + Math.floor(1000 + Math.random() * 9000);
            try {
                const roomRef = doc(db, 'rooms', roomCode);
                await setDoc(roomRef, { created: Date.now(), host: 'Samuel', status: 'waiting', pot: 0 });
                
                document.getElementById('display-room-code').innerText = roomCode;
                document.getElementById('active-room-indicator').classList.remove('hidden');
                document.getElementById('room-status-info').innerText = `Berhasil! Kode Meja: ${roomCode}`;
                document.getElementById('room-status-info').classList.remove('hidden');
                
                alert(`Meja Berhasil Dibuat!\nKode Room Anda: ${roomCode}`);
                window.toggleOnlineModal();
            } catch (err) {
                alert("Gagal membuat room ke database: " + err.message);
            }
        };

        window.handleJoinRoomUI = async function() {
            const code = document.getElementById('room-code-input').value.trim().toUpperCase();
            if (!code) {
                alert("Masukkan Kode Room terlebih dahulu!");
                return;
            }

            if (!isReady || !db) {
                alert("Koneksi Firebase sedang diproses, coba sebentar lagi.");
                return;
            }

            document.getElementById('display-room-code').innerText = code;
            document.getElementById('active-room-indicator').classList.remove('hidden');
            alert(`Berhasil Bergabung ke Meja: ${code}`);
            window.toggleOnlineModal();
        };
    </script>

    <!-- FULL GAME GRAPHICS & LOGIC ENGINE -->
    <script>
        const canvas = document.getElementById('pokerCanvas');
        const ctx = canvas.getContext('2d');
        let cameraOffset = 0;
        let targetCameraOffset = 0;
        let gameMode = 'POKER';

        function panCamera(delta) {
            targetCameraOffset = Math.max(-280, Math.min(280, targetCameraOffset + delta));
        }
        function resetCamera() { targetCameraOffset = 0; }

        function switchGameMode(mode) {
            gameMode = mode;
            document.getElementById('mode-poker').className = mode === 'POKER' ? 'px-3 py-1.5 rounded-lg font-bold bg-amber-500 text-slate-950 shadow-md' : 'px-3 py-1.5 rounded-lg font-bold text-slate-400';
            document.getElementById('mode-bj').className = mode === 'BLACKJACK' ? 'px-3 py-1.5 rounded-lg font-bold bg-amber-500 text-slate-950 shadow-md' : 'px-3 py-1.5 rounded-lg font-bold text-slate-400';
            document.getElementById('poker-controls').style.display = mode === 'POKER' ? 'flex' : 'none';
            document.getElementById('bj-controls').style.display = mode === 'BLACKJACK' ? 'flex' : 'none';
        }

        function resizeCanvas() {
            if (!canvas || !canvas.parentElement) return;
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function render() {
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            cameraOffset += (targetCameraOffset - cameraOffset) * 0.1;
            ctx.save();
            ctx.translate(cameraOffset, 0);

            // Background & Table Felt
            ctx.fillStyle = '#06090e';
            ctx.fillRect(-200, 0, w + 400, h);

            const rx = w * 0.45;
            const ry = h * 0.38;
            ctx.beginPath();
            ctx.ellipse(w/2, h * 0.55, rx, ry, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#145a32';
            ctx.fill();
            ctx.lineWidth = 12;
            ctx.strokeStyle = '#5c3a21';
            ctx.stroke();

            ctx.restore();
            requestAnimationFrame(render);
        }

        window.onload = function() {
            resizeCanvas();
            render();
        };

        function handlePlayerAction(action) { alert('Aksi: ' + action); }
        function blackjackHit() { alert('Hit Blackjack'); }
        function blackjackStand() { alert('Stand Blackjack'); }
    </script>
</body>
</html>
